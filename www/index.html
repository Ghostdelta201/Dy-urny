<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dyżury</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2b4a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#e2e0d8;--red:#d62828;
--blue:#cfe3ff;--blueT:#12417d;--yel:#ffe680;--yelT:#6b5200;--grn:#c9eed2;--grnT:#115c2a;--acc:#2b4a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222428;--tx:#eee;--mut:#9a9a94;--bd:#33363b;--red:#ff6b6b;
--blue:#1f3d66;--blueT:#bcd9ff;--yel:#5c4a08;--yelT:#ffe27a;--grn:#1a4a2a;--grnT:#b6f0c4;--acc:#7fa4ee;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.top h1{font-size:19px;margin:0;text-transform:capitalize}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.sum b{display:block;font-size:20px}.sum span{font-size:11px;color:var(--mut)}
.hd,.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hd div{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}.hd .r{color:var(--red)}
.d{min-height:74px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden}
.d.o{opacity:.35}.d.t{outline:2px solid var(--acc)}
.n{font-size:13px;font-weight:600}.n.r{color:var(--red)}
.c{font-size:11px;border-radius:6px;padding:2px 3px;text-align:center;line-height:1.15;font-weight:600}
.c.blue{background:var(--blue);color:var(--blueT)}.c.yel{background:var(--yel);color:var(--yelT)}.c.grn{background:var(--grn);color:var(--grnT)}
.al{font-size:10px;color:var(--mut);text-align:center}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;font-size:12px}.leg .c{padding:3px 8px}
.note{font-size:12px;color:var(--mut);margin:8px 0}
.set{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
.set h3{margin:0 0 8px;font-size:14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
input,select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.m.s{display:flex}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 10px;font-size:17px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.opts button{padding:12px 6px;font-weight:600;border:2px solid transparent}
.opts .blue{background:var(--blue);color:var(--blueT)}.opts .yel{background:var(--yel);color:var(--yelT)}.opts .grn{background:var(--grn);color:var(--grnT)}
.opts .sel{border-color:var(--tx)}
.ring{position:fixed;inset:0;background:rgba(214,40,40,.95);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;font-size:22px;text-align:center}
.ring.s{display:flex}.ring .big{font-size:80px;animation:sh .4s infinite}
@keyframes sh{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.ring button{font-size:20px;padding:14px 30px}
</style></head><body>
<div class="w">
 <div class="top"><button id="pv">‹</button><h1 id="ttl"></h1><button id="nx">›</button></div>
 <div class="sum"><div><b id="s1">0</b><span>godz. zaplanowane</span></div><div><b id="s2">0</b><span>godz. przepracowane</span></div><div><b id="s3">0</b><span>dni urlopu</span></div></div>
 <div class="hd" id="hd"></div><div class="g" id="g"></div>
 <div class="leg"><span class="c blue">☀ Rano</span><span class="c yel">☾ Noc</span><span class="c grn">Urlop</span><span class="c" style="color:var(--red);border:1px solid var(--red)">Sob., niedz., święta</span></div>
 <div class="note">⏰ Alarm dzwoni, gdy ta karta jest otwarta (telefon odblokowany, dźwięk włączony). Dotknij dnia, aby wpisać dyżur.</div>
 <div class="set"><h3>Ustawienia alarmów</h3>
  <label>Alarm przed rano<input type="time" id="aR"></label>
  <label>Alarm przed nocką<input type="time" id="aN"></label>
  <label>Dźwięk domyślny<select id="aS"></select></label>
  <button id="tst">▶ Testuj dźwięk</button>
 </div>
</div>
<div class="m" id="m"><div class="sh">
 <h2 id="mt"></h2>
 <div class="opts" id="op"></div>
 <label>Alarm<input type="time" id="mal"></label>
 <label>Dźwięk<select id="msd"></select></label>
 <div style="display:flex;gap:8px;margin-top:12px"><button id="del">Usuń</button><button id="cl" style="flex:1">Anuluj</button><button class="p" id="sv" style="flex:1">Zapisz</button></div>
</div></div>
<div class="ring" id="ring"><div class="big">⏰</div><div id="rt"></div><button id="stop">Wyłącz alarm</button></div>
<script>
var TY={R12:{n:'Rano 12h',i:'☀',h:12,t:'7:30–19:30',c:'blue',k:'R'},R8:{n:'Rano 8h',i:'☀',h:8,t:'7:30–15:30',c:'blue',k:'R'},R4:{n:'Rano 4h',i:'☀',h:4,t:'7:30–11:30',c:'blue',k:'R'},N12:{n:'Noc 12h',i:'☾',h:12,t:'19:30–7:30',c:'yel',k:'N'},U:{n:'Urlop',i:'🌴',h:0,t:'',c:'grn',k:'U'}};
var SD={prl:'Telefon PRL ☎',bud:'Budzik ⏰',zeg:'Zegarek ⌚'};
var MN=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
var S={shifts:{},set:{r:'06:00',n:'17:30',s:'prl'}};
try{var x=localStorage.getItem('dyz1');if(x)S=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem('dyz1',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var now=new Date(),vy=now.getFullYear(),vm=now.getMonth(),sel=null,selT=null;
function key(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
var hc={};
function hol(y){if(hc[y])return hc[y];var s={};['1-1','1-6','5-1','5-3','8-15','11-1','11-11','12-25','12-26'].forEach(function(z){var p=z.split('-');s[key(y,p[0]-1,+p[1])]=1});
var e=easter(y);[0,1,49,60].forEach(function(o){var d=new Date(e.getFullYear(),e.getMonth(),e.getDate()+o);s[key(d.getFullYear(),d.getMonth(),d.getDate())]=1});return hc[y]=s}
function render(){
 $('ttl').textContent=MN[vm]+' '+vy;
 $('hd').innerHTML=['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(function(d,i){return '<div class="'+(i>4?'r':'')+'">'+d+'</div>'}).join('');
 var first=new Date(vy,vm,1),off=(first.getDay()+6)%7,html='',tk=key(now.getFullYear(),now.getMonth(),now.getDate());
 var plan=0,done=0,vac=0;
 for(var i=0;i<42;i++){
  var d=new Date(vy,vm,1-off+i),k=key(d.getFullYear(),d.getMonth(),d.getDate()),o=d.getMonth()!==vm,wk=d.getDay()===0||d.getDay()===6,red=wk||hol(d.getFullYear())[k];
  var sh=S.shifts[k],c='';
  if(sh&&TY[sh.t]){var T=TY[sh.t];c='<div class="c '+T.c+'">'+T.i+' '+T.n+'</div>'+(sh.a&&T.k!=='U'?'<div class="al">⏰ '+sh.a+'</div>':'');
   if(!o){if(T.k==='U')vac++;else{plan+=T.h;var st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),T.k==='N'?19:7,30);var en=st.getTime()+T.h*36e5;if(en<=now.getTime())done+=T.h;else if(st.getTime()<now.getTime())done+=(now.getTime()-st.getTime())/36e5}}}
  html+='<div class="d'+(o?' o':'')+(k===tk?' t':'')+'" data-k="'+k+'"><span class="n'+(red?' r':'')+'">'+d.getDate()+'</span>'+c+'</div>'}
 $('g').innerHTML=html;$('s1').textContent=plan;$('s2').textContent=Math.round(done*10)/10;$('s3').textContent=vac;
 [].forEach.call(document.querySelectorAll('.d'),function(el){el.onclick=function(){openM(el.dataset.k)}})}
function defAl(t){var k=TY[t].k;return k==='R'?S.set.r:k==='N'?S.set.n:''}
function fillSnd(el,v){el.innerHTML=Object.keys(SD).map(function(k){return '<option value="'+k+'"'+(k===v?' selected':'')+'>'+SD[k]+'</option>'}).join('')}
function openM(k){sel=k;var sh=S.shifts[k];selT=sh?sh.t:null;var p=k.split('-');$('mt').textContent=(+p[2])+' '+MN[p[1]-1];
 $('op').innerHTML=Object.keys(TY).map(function(t){var T=TY[t];return '<button class="'+T.c+(t===selT?' sel':'')+'" data-t="'+t+'">'+T.i+' '+T.n+'<br><small>'+T.t+'</small></button>'}).join('');
 [].forEach.call($('op').children,function(b){b.onclick=function(){selT=b.dataset.t;[].forEach.call($('op').children,function(x){x.classList.remove('sel')});b.classList.add('sel');$('mal').value=defAl(selT);$('mal').parentNode.style.display=TY[selT].k==='U'?'none':'flex';$('msd').parentNode.style.display=TY[selT].k==='U'?'none':'flex'}});
 $('mal').value=sh&&sh.a!==undefined?sh.a:(selT?defAl(selT):'');fillSnd($('msd'),sh&&sh.s||S.set.s);
 var u=selT&&TY[selT].k==='U';$('mal').parentNode.style.display=u?'none':'flex';$('msd').parentNode.style.display=u?'none':'flex';
 $('m').classList.add('s')}
$('sv').onclick=function(){if(!selT){delete S.shifts[sel]}else{S.shifts[sel]={t:selT,a:TY[selT].k==='U'?'':$('mal').value,s:$('msd').value}}save();$('m').classList.remove('s');render()};
$('del').onclick=function(){delete S.shifts[sel];save();$('m').classList.remove('s');render()};
$('cl').onclick=function(){$('m').classList.remove('s')};
$('m').onclick=function(e){if(e.target===$('m'))$('m').classList.remove('s')};
$('pv').onclick=function(){vm--;if(vm<0){vm=11;vy--}render()};
$('nx').onclick=function(){vm++;if(vm>11){vm=0;vy++}render()};
$('aR').value=S.set.r;$('aN').value=S.set.n;fillSnd($('aS'),S.set.s);
$('aR').onchange=function(){S.set.r=this.value;save()};$('aN').onchange=function(){S.set.n=this.value;save()};$('aS').onchange=function(){S.set.s=this.value;save()};
// dźwięk
var ctx=null,ti=null,tt=null;
function ac(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx}
function beep(f,t,d,v,mod){var o=ctx.createOscillator(),g=ctx.createGain();o.type=mod?'sine':'square';o.frequency.value=f;g.gain.value=v;
 if(mod){var l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=25;lg.gain.value=v;l.connect(lg);lg.connect(g.gain);l.start(t);l.stop(t+d)}
 o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d)}
function cyc(kind){var t=ctx.currentTime+.05,i;
 if(kind==='prl'){[0,.6].forEach(function(o){beep(425,t+o,.4,.35,1)})}
 else if(kind==='bud'){for(i=0;i<4;i++)beep(900,t+i*.22,.12,.2)}
 else{for(i=0;i<2;i++)beep(2300,t+i*.12,.06,.15)}}
function play(kind,loop){if(!ac())return;stopS();var p=kind==='prl'?2000:kind==='bud'?1600:1000;cyc(kind);
 if(loop){ti=setInterval(function(){cyc(kind)},p);tt=setTimeout(stopAl,120000)}}
function stopS(){clearInterval(ti);clearTimeout(tt)}
function stopAl(){stopS();$('ring').classList.remove('s')}
$('stop').onclick=stopAl;
$('tst').onclick=function(){play($('aS').value,false)};
$('msd').onchange=function(){play(this.value,false)};
document.addEventListener('click',function(){ac()},{once:true});
try{if('Notification' in window&&Notification.permission==='default')document.addEventListener('click',function(){Notification.requestPermission()},{once:true})}catch(e){}
// alarmy
var fired={};
setInterval(function(){var n=new Date(),k=key(n.getFullYear(),n.getMonth(),n.getDate()),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),sh=S.shifts[k];
 if(sh&&sh.a&&sh.a===hm&&!fired[k+hm]){fired[k+hm]=1;var T=TY[sh.t];$('rt').innerHTML='Dyżur: '+T.n+'<br>'+T.t;$('ring').classList.add('s');play(sh.s||S.set.s,true);
  try{if(Notification.permission==='granted')new Notification('Dyżur: '+T.n,{body:T.t})}catch(e){}}},1000);
// ===== natywne alarmy Androida (dzwonią też przy zamkniętej aplikacji) =====
var LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function syncN(){
 if(!LN)return;
 try{
  var p=await LN.checkPermissions();
  if(p.display!=='granted'){p=await LN.requestPermissions();if(p.display!=='granted')return}
  try{var ex=await LN.checkExactNotificationSetting();if(ex.exact_alarm!=='granted')await LN.changeExactNotificationSetting()}catch(e){}
  for(var c in SD){await LN.createChannel({id:'al_'+c,name:'Alarm: '+SD[c],importance:5,sound:'al_'+c+'.wav',vibration:true,visibility:1})}
  var pe=await LN.getPending();
  if(pe.notifications.length)await LN.cancel({notifications:pe.notifications.map(function(n){return{id:n.id}})});
  var list=[],now=Date.now();
  for(var k in S.shifts){var sh=S.shifts[k];if(!sh.a||!TY[sh.t])continue;
   var q=k.split('-'),h=sh.a.split(':'),at=new Date(+q[0],q[1]-1,+q[2],+h[0],+h[1]);
   if(at.getTime()<=now)continue;
   list.push({id:+(q[0]+q[1]+q[2]),title:'Dyżur: '+TY[sh.t].n,body:TY[sh.t].t,schedule:{at:at,allowWhileIdle:true},channelId:'al_'+(sh.s||S.set.s)})}
  if(list.length)await LN.schedule({notifications:list});
 }catch(e){console.error(e)}}
var _sv=save;save=function(){_sv();syncN()};
syncN();

render();

</script></body></html>
